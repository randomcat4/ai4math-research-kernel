# Every path is resolved relative to this file. Copy locally; do not commit secrets.
workspace_root = ".rk"
db_path = ".rk/rk.sqlite"
cas_root = ".rk/cas"
spec_root = "docs/spec"
inbox_roots = [".rk/inbox"]

busy_timeout_ms = 5000
max_artifact_bytes = 67108864
orphan_grace_seconds = 86400

# The key bytes live outside Git. Both values are required only by rkctl write commands.
capability_key_path = ".rk/secrets/capability.key"
capability_key_id = "replace-with-host-key-id"

# Profiles are registries, not model-specific business branches. Add deployment values locally.
[adapter_profiles]

[verifier_profiles]

# AUTO performs real host RAM/GPU discovery and records the resulting placement plan in every
# research checkpoint/report. Set the two service flags to false when deployment has no such path.
[product.hardware_plan]
mode = "AUTO"
api_candidate_available = true
public_retrieval_available = true
local_assets = []
retrieval_top_k = 8
require_jixia = false

# Hard enforcement policy. Values use the same microunit convention as RecordBudget.
[budget_policy]
budget_controller_capability_ids = []
route_share_denominator = 5

[budget_policy.global_budget_limits]
INPUT_TOKEN = 100000000000000
OUTPUT_TOKEN = 100000000000000
CPU_SECOND = 36000000000000
GPU_SECOND = 2592000000000
